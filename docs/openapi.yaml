openapi: 3.0.3
info:
  title: Ticket Sales API
  version: 1.0.0
  description: REST API za prodaju ulaznica, događaje, rezervacije i autentifikaciju.
servers:
  - url: http://localhost:8000/api
    description: Lokalni Laravel backend
  - url: http://localhost:3000/api
    description: Docker frontend proxy
paths:
  /register:
    post:
      summary: Registracija korisnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Korisnik i Bearer token
        "422":
          $ref: "#/components/responses/ValidationError"
  /login:
    post:
      summary: Prijava korisnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Bearer token
        "401":
          description: Pogrešni podaci za prijavu
  /events:
    get:
      summary: Lista događaja sa pretragom i paginacijom
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Paginirana lista događaja
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Kreiranje događaja (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRequest"
      responses:
        "201": { description: Događaj kreiran }
        "403": { description: Potrebna je admin uloga }
  /events/{event}:
    get:
      summary: Detalji događaja
      parameters:
        - { $ref: "#/components/parameters/EventId" }
      responses:
        "200": { description: Događaj sa tipovima karata }
        "404": { description: Događaj nije pronađen }
  /events/{event}/seat-selection/{ticketType}:
    get:
      summary: Prikaz sedišta za tip karte
      parameters:
        - { $ref: "#/components/parameters/EventId" }
        - { $ref: "#/components/parameters/TicketTypeId" }
      responses:
        "200": { description: Mapa sedišta }
  /events/{event}/seat-selection/{ticketType}/reserve:
    post:
      summary: Rezervacija sedišta
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/EventId" }
        - { $ref: "#/components/parameters/TicketTypeId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_ids]
              properties:
                seat_ids:
                  type: array
                  items: { type: integer }
                ttl_minutes: { type: integer, minimum: 2, maximum: 60 }
      responses:
        "201": { description: Sedišta rezervisana }
        "403": { description: Potrebna je autentifikacija }
        "422": { description: Sedište nije dostupno }
  /purchases:
    get:
      summary: Kupovine prijavljenog korisnika
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Lista kupovina }
    post:
      summary: Rezervacija tipova karata
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Kupovina kreirana }
  /purchases/{purchase}/pay:
    post:
      summary: Plaćanje sopstvene kupovine
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PurchaseId" }
      responses:
        "200": { description: Kupovina plaćena }
        "403": { description: Kupovina pripada drugom korisniku }
  /purchases/{purchase}/cancel:
    post:
      summary: Otkazivanje sopstvene kupovine
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/PurchaseId" }
      responses:
        "200": { description: Kupovina otkazana }
  /contact:
    post:
      summary: Slanje kontakt poruke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string, maxLength: 100 }
                email: { type: string, format: email }
                message: { type: string, maxLength: 1000 }
      responses:
        "202": { description: Poruka prihvaćena }
  /external/weather:
    get:
      summary: Trenutno vreme za Beograd preko Open-Meteo API-ja
      responses:
        "200": { description: Vremenski podaci }
  /external/exchange-rate:
    get:
      summary: Kurs EUR/RSD preko Frankfurter API-ja
      responses:
        "200": { description: Kursna lista }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    EventId:
      name: event
      in: path
      required: true
      schema: { type: integer }
    TicketTypeId:
      name: ticketType
      in: path
      required: true
      schema: { type: integer }
    PurchaseId:
      name: purchase
      in: path
      required: true
      schema: { type: integer }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    EventRequest:
      type: object
      required: [title, slug, venue, start_at]
      properties:
        title: { type: string }
        slug: { type: string }
        venue: { type: string }
        city: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
