services:
  database:
    image: mysql:8.0
    container_name: tickets-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tickets_db
      MYSQL_USER: tickets_user
      MYSQL_PASSWORD: secret_password
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - tickets-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build: ./tickets
    container_name: tickets-backend
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=tickets_db
      - DB_USERNAME=tickets_user
      - DB_PASSWORD=secret_password
      - APP_ENV=local
      - APP_DEBUG=true
      - PORT=8080
    depends_on:
      database:
        condition: service_healthy
    networks:
      - tickets-network

  frontend:
    build: ./frontend
    container_name: tickets-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tickets-network

volumes:
  db-data:
    driver: local

networks:
  tickets-network:
    driver: bridge