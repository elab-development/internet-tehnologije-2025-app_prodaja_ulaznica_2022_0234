services:
  mysql:
    image: mysql:8.0
    container_name: tickets_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tickets
      MYSQL_USER: tickets
      MYSQL_PASSWORD: tickets
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./tickets
      dockerfile: Dockerfile
    container_name: tickets_backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:8R8v2Q2f7g0L4mM0v6p9X8s2r5T1u3W0y7K4n6B9c2A=}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tickets
      DB_USERNAME: tickets
      DB_PASSWORD: tickets
      FRONTEND_URL: http://localhost:5173
    command: sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=8000"

  scheduler:
    build:
      context: ./tickets
      dockerfile: Dockerfile
    container_name: tickets_scheduler
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-base64:8R8v2Q2f7g0L4mM0v6p9X8s2r5T1u3W0y7K4n6B9c2A=}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tickets
      DB_USERNAME: tickets
      DB_PASSWORD: tickets
      FRONTEND_URL: http://localhost:5173
    command: php artisan schedule:work

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tickets_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: tickets_phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"

volumes:
  mysql_data:
