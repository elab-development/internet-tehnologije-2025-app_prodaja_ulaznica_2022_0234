version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tickets_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - tickets_network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: tickets_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - tickets_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: tickets_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: prodaja_ulaznica
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tickets_network

networks:
  tickets_network:
    driver: bridge

volumes:
  db_data: